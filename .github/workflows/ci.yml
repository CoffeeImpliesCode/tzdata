name: CI

# Verification for this fork of the IANA Time Zone Database.
# Upstream ships no CI configuration at tag 2026e, so nothing was inherited;
# see CHANGELOG.md entry 6.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  ZIG_FLAGS: -j8 --summary all --cache-dir .zig-cache

jobs:
  build:
    name: native (${{ matrix.optimize }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        optimize: [Debug, ReleaseSafe]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build library, zic and the database
        run: zig build -Doptimize=${{ matrix.optimize }} $ZIG_FLAGS
      - name: Unit tests
        run: zig build test -Doptimize=${{ matrix.optimize }} $ZIG_FLAGS
      - name: Smoke program
        run: zig build smoke -Doptimize=${{ matrix.optimize }} $ZIG_FLAGS

  check:
    name: cross-target compile matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Compile facade, library, zic, smoke and tests for all targets
        run: zig build check -Doptimize=ReleaseSafe $ZIG_FLAGS

  provenance:
    name: licence and provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Verify preserved upstream files
        run: zig build provenance $ZIG_FLAGS

  consumer:
    name: downstream consumer package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Run the consumer package
        working-directory: consumer
        run: zig build run -j8 --summary all --cache-dir .zig-cache